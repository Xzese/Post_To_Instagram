name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies and project
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate source
        run: |
          python -m compileall -q src tests upload_photo.py
          ruff check src tests upload_photo.py
          ruff format --check src tests upload_photo.py
          python -m pip check
      - name: Failure injection, HTTP integration and packaging tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel --no-isolation --outdir output/dist
      - name: Audit locked dependencies
        if: matrix.python == '3.11'
        run: pip-audit --disable-pip --no-deps -r requirements-lock.txt
